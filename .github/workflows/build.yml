name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and package
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew build --console=plain --stacktrace 2>&1 | tee gradle.log
          exit ${PIPESTATUS[0]}

      - name: Report build errors
        if: steps.build.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -nE -A3 "error:" gradle.log | head -400 > errors.txt || true
          grep -nE "warning: \[removal\]|What went wrong|FAILED|Caused by|Execution failed|Could not resolve" gradle.log | head -40 >> errors.txt || true
          printf '\n--- last 40 lines ---\n' >> errors.txt
          tail -40 gradle.log >> errors.txt
          head -c 60000 errors.txt > body.txt
          gh api "repos/${{ github.repository }}/issues/1/comments" -f body="$(cat body.txt)" > /dev/null

      - name: Introspect Minecraft (diagnostics)
        if: always()
        run: |
          ./gradlew -q printCompileClasspath --console=plain 2>/dev/null | grep -m1 -i "minecraft.*named" > mcp.txt || true
          MC=$(cat mcp.txt 2>/dev/null | tr -d '[:space:]')
          echo "jar candidate: $MC"
          python3 tools/diag.py "$MC" > diag.txt 2>&1 || true
          head -c 60000 diag.txt > diag-body.txt
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} gh api "repos/${{ github.repository }}/issues/1/comments" -f body="$(cat diag-body.txt)" > /dev/null || true

      - name: Show outputs
        if: steps.build.outcome == 'success'
        run: ls -la build/libs

      - name: Upload jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hollowlight
          path: build/libs/hollowlight-1.0.1.jar
          if-no-files-found: error

      - name: Attach jar to release
        if: steps.build.outcome == 'success' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/hollowlight-1.0.1.jar
